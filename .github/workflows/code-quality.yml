name: Code Quality

on:
  workflow_call:
    inputs:
      php_version:
        default: '8.0'
        type: string
      node_version:
        default: '16'
        type: string
      jobs:
        default: '["ecs"]'
        type: string
jobs:
  ecs:
    name: ECS
    if: ${{ contains(fromJSON(inputs.jobs), 'ecs') }}
    uses: ./.github/workflows/ecs.yml
    with:
      php_version: ${{ inputs.php_version }}
  pint:
    name: Pint
    if: ${{ contains(fromJSON(inputs.jobs), 'pint') }}
    uses: ./.github/workflows/pint.yml
    with:
      php_version: ${{ inputs.php_version }}
  phpstan:
    name: PHPStan
    if: ${{ contains(fromJSON(inputs.jobs), 'phpstan') }}
    uses: ./.github/workflows/phpstan.yml
    with:
      php_version: ${{ inputs.php_version }}
  larastan:
    name: Larastan
    if: ${{ contains(fromJSON(inputs.jobs), 'larastan') }}
    uses: ./.github/workflows/larastan.yml
    with:
      php_version: ${{ inputs.php_version }}
